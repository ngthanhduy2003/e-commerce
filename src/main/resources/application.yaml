spring:
  application:
      name: ecommerce

  # ===============================
  # DATASOURCE (MySQL + HikariCP)
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  # ===============================
  # REDIS
  # ===============================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  # ===============================
  # STOCK RESERVATION CONFIGURATION
  # ===============================
  stock-reservation:
    expiration-minutes: 15

  # ===============================
  # MAIL
  # ===============================
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 1c2586a34a7dde
    password: d785467697069d
    properties:
      mail:
        SMTP:
          auth: true
          STARTTLS:
            enable: true

# ===============================
# SERVER
# ===============================
server:
  port: 8080

# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.example: DEBUG
    org.springframework.security: DEBUG

# ===============================
# ACTUATOR & MONITORING
# ===============================

# ===============================
# APPLICATION CUSTOM CONFIG
# ===============================
app:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000  # 24 hours
      refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  default-page-size: 20
